[package]
name = "agent-air-runtime"
version = "0.7.0"
edition = "2024"
description = "Core runtime for agent-air - LLM orchestration, tools, and permissions (no TUI dependencies)"
license = "MIT"
repository = "https://github.com/deepmesa/agent-air"
keywords = ["llm", "agent", "ai", "anthropic", "openai"]
categories = ["api-bindings", "asynchronous"]

[features]
db = ["dep:heed"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "full"] }
tokio-util = "0.7"
tokio-stream = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Serialization
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# File system
dirs = "5"
globset = "0.4"
regex = "1"
walkdir = "2"

# Ripgrep crates for fast file searching
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"

# String similarity for fuzzy matching
strsim = "0.11"

# Async utilities
futures = "0.3"

# Error handling
thiserror = "2.0"

# HTTP client dependencies
async-stream = "0.3"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["full"] }
hyper-rustls = { version = "0.27.7", features = ["native-tokio", "http1", "http2", "tls12"] }
hyper-util = { version = "0.1.19", features = ["client-legacy", "http1", "http2", "tokio"] }

# AWS dependencies for Bedrock
aws-sigv4 = "1.2"
aws-credential-types = "1.2"
ring = "0.17"
hex = "0.4"

# Embedded database (optional, behind "db" feature)
heed = { version = "0.22", features = ["serde-json"], optional = true }

[dev-dependencies]
tempfile = "3"
