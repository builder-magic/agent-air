[package]
name = "llm-controller-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
tokio-util = "0.7"
tracing = "0.1"
vangogh-rs = { path = "../vangogh-rs" }
