[workspace]
resolver = "2"
members = [
    "agent-air-runtime",
    "agent-air-tui",
]

# The main agent-air package (meta-crate that re-exports sub-crates)
[package]
name = "agent-air"
version = "0.7.0"
edition = "2024"
description = "A Rust Framework to build TUI Agents"
license = "MIT"
repository = "https://github.com/deepmesa/agent-air"
homepage = "https://agent-air.ai"
documentation = "https://agent-air.ai/docs/introduction"
keywords = ["llm", "agent", "tui", "ai", "anthropic"]
categories = ["command-line-interface", "api-bindings"]

[features]
default = ["tui"]
tui = ["dep:agent-air-tui"]

[dependencies]
# Always include the runtime
agent-air-runtime = { path = "agent-air-runtime", version = "0.7.0" }

# Optionally include the TUI
agent-air-tui = { path = "agent-air-tui", version = "0.7.0", optional = true }

[dev-dependencies]
tempfile = "3"
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-fmt", "run-cargo-clippy"] }
