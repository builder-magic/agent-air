[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"
description = "Reusable TUI components, LLM client, controller, and agent infrastructure for LLM applications"

[dependencies]
# TUI dependencies
ratatui = "0.30"
crossterm = "0.28"
tui-textarea = "0.7"
pulldown-cmark = "0.13.0"
unicode-width = "0.2"

# Agent dependencies
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
futures = "0.3"

# HTTP client dependencies (from vangogh-rs)
async-stream = "0.3"
http-body-util = "0.1.3"
hyper = { version = "1.8.1", features = ["full"] }
hyper-rustls = { version = "0.27.7", features = ["native-tokio", "http1", "http2", "tls12"] }
hyper-util = { version = "0.1.19", features = ["client-legacy", "http1", "http2", "tokio"] }
