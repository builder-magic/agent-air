[workspace]
resolver = "2"
members = [
    "agent-core-runtime",
    "agent-core-tui",
]

# The main agent-core package (meta-crate that re-exports sub-crates)
[package]
name = "agent-core"
version = "0.5.0"
edition = "2024"
description = "A Rust Framework to build TUI Agents"
license = "MIT"
repository = "https://github.com/deepmesa/agent-core"
keywords = ["llm", "agent", "tui", "ai", "anthropic"]
categories = ["command-line-interface", "api-bindings"]

[features]
default = ["tui"]
tui = ["dep:agent-core-tui"]

[dependencies]
# Always include the runtime
agent-core-runtime = { path = "agent-core-runtime", version = "0.5.0" }

# Optionally include the TUI
agent-core-tui = { path = "agent-core-tui", version = "0.5.0", optional = true }

[dev-dependencies]
tempfile = "3"
